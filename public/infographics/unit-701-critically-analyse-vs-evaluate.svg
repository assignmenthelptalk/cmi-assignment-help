<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 405" width="760" height="405" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect x="0.8" y="0.8" width="758.5" height="403.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">Critically Analyse (Level 7) vs Evaluate (Level 5)</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">The jump in depth that Unit 701 requires</text><clipPath id="tc37"><rect x="28" y="84.6" width="704" height="278.2" rx="10"/></clipPath><g clip-path="url(#tc37)"><rect x="28" y="84.6" width="704" height="278.2" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="28" y="84.6" width="151.8" height="31.2" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="36" y="103.1" font-size="11.5" fill="#fff" font-weight="700"></text><rect x="179.8" y="84.6" width="276.1" height="31.2" rx="0" fill="#15803d" stroke="none" stroke-width="1"/><text x="187.8" y="103.1" font-size="11.5" fill="#fff" font-weight="700">Evaluate (CMI Level 5)</text><rect x="455.9" y="84.6" width="276.1" height="31.2" rx="0" fill="#6d28d9" stroke="none" stroke-width="1"/><text x="463.9" y="103.1" font-size="11.5" fill="#fff" font-weight="700">Critically Analyse (CMI Level 7)</text><text x="36" y="134.3" font-size="11.5" fill="#1a2e4a" font-weight="700">What it requires</text><text x="187.8" y="134.3" font-size="11.5" fill="#1f2937">Apply criteria to weigh effectiveness and</text><text x="187.8" y="149.5" font-size="11.5" fill="#1f2937">reach a judgement</text><text x="463.9" y="134.3" font-size="11.5" fill="#1f2937">Break the problem into components, apply</text><text x="463.9" y="149.5" font-size="11.5" fill="#1f2937">empirical evidence to each, and</text><text x="463.9" y="164.7" font-size="11.5" fill="#1f2937">synthesise an original position</text><line x1="28" y1="115.8" x2="732" y2="115.8" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="177.3" width="704" height="46.4" rx="0" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="36" y="195.8" font-size="11.5" fill="#1a2e4a" font-weight="700">Evidence standard</text><text x="187.8" y="195.8" font-size="11.5" fill="#1f2937">Management texts and CMI publications,</text><text x="187.8" y="211" font-size="11.5" fill="#1f2937">10–12 sources</text><text x="463.9" y="195.8" font-size="11.5" fill="#1f2937">Peer-reviewed empirical research, 15–20</text><text x="463.9" y="211" font-size="11.5" fill="#1f2937">sources</text><line x1="28" y1="177.3" x2="732" y2="177.3" stroke="#e5e7eb" stroke-width="1"/><text x="36" y="242.2" font-size="11.5" fill="#1a2e4a" font-weight="700">Treatment of</text><text x="36" y="257.4" font-size="11.5" fill="#1a2e4a" font-weight="700">limitations</text><text x="187.8" y="242.2" font-size="11.5" fill="#1f2937">Named and evidenced for Distinction</text><text x="463.9" y="242.2" font-size="11.5" fill="#1f2937">Limits and assumptions identified for</text><text x="463.9" y="257.4" font-size="11.5" fill="#1f2937">every framework used</text><line x1="28" y1="223.7" x2="732" y2="223.7" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="270.1" width="704" height="46.4" rx="0" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="36" y="288.6" font-size="11.5" fill="#1a2e4a" font-weight="700">Competing</text><text x="36" y="303.7" font-size="11.5" fill="#1a2e4a" font-weight="700">perspectives</text><text x="187.8" y="288.6" font-size="11.5" fill="#1f2937">Considered, with contradictions resolved</text><text x="187.8" y="303.7" font-size="11.5" fill="#1f2937">for the context</text><text x="463.9" y="288.6" font-size="11.5" fill="#1f2937">Conflicting research engaged directly,</text><text x="463.9" y="303.7" font-size="11.5" fill="#1f2937">with a position taken</text><line x1="28" y1="270.1" x2="732" y2="270.1" stroke="#e5e7eb" stroke-width="1"/><text x="36" y="334.9" font-size="11.5" fill="#1a2e4a" font-weight="700">Output</text><text x="187.8" y="334.9" font-size="11.5" fill="#1f2937">A reasoned judgement against stated</text><text x="187.8" y="350.1" font-size="11.5" fill="#1f2937">criteria</text><text x="463.9" y="334.9" font-size="11.5" fill="#1f2937">An original, defended strategic position</text><line x1="28" y1="316.4" x2="732" y2="316.4" stroke="#e5e7eb" stroke-width="1"/><line x1="179.8" y1="115.8" x2="179.8" y2="362.8" stroke="#e5e7eb" stroke-width="1"/><line x1="455.9" y1="115.8" x2="455.9" y2="362.8" stroke="#e5e7eb" stroke-width="1"/></g><rect x="28" y="84.6" width="704" height="278.2" rx="10" fill="none" stroke="#e5e7eb" stroke-width="1.5"/><text x="732" y="387.3" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI Unit 701 assignment help</text></svg>
