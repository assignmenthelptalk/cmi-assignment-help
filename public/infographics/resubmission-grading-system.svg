<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 445" width="760" height="445" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><defs><marker id="rg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker></defs><rect x="0.8" y="0.8" width="758.5" height="443.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">The CMI Grading System: Where a Refer Sits</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">A Refer is a chance to revise and resubmit, not a permanent fail</text><rect x="28" y="84.6" width="554" height="54" rx="10" fill="#b8860b" stroke="none" stroke-width="1"/><text x="44" y="107.625" font-size="15" font-weight="700" fill="#fff">Distinction</text><text x="44" y="123.1" font-size="11.5" fill="#fff">Comprehensive critical engagement; limitations acknowledged</text><rect x="28" y="148.6" width="487.5" height="54" rx="10" fill="#6b7280" stroke="none" stroke-width="1"/><text x="44" y="171.625" font-size="15" font-weight="700" fill="#fff">Merit</text><text x="44" y="187.1" font-size="11.5" fill="#fff">Applied analysis at the command verb depth expected</text><rect x="28" y="212.6" width="421" height="54" rx="10" fill="#16a34a" stroke="none" stroke-width="1"/><text x="44" y="235.625" font-size="15" font-weight="700" fill="#fff">Pass</text><text x="44" y="251.1" font-size="11.5" fill="#fff">All Learning Outcomes met at baseline</text><rect x="28" y="276.6" width="354.6" height="54" rx="10" fill="#fcd34d" stroke="none" stroke-width="1"/><text x="44" y="299.625" font-size="15" font-weight="700" fill="#78350f">Refer</text><text x="44" y="315.1" font-size="11.5" fill="#78350f">Not yet met: revise and resubmit</text><line x1="408.6" y1="303.6" x2="408.6" y2="270.6" stroke="#b45309" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#rg-arrow)"/><text x="422.6" y="297.6" font-size="12" fill="#b45309" font-weight="700">Resubmission opportunity: back towards</text><text x="422.6" y="313.8" font-size="12" fill="#b45309" font-weight="700">Pass</text><rect x="28" y="344.6" width="704" height="52" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/><text x="42" y="366.1" font-size="11.5" fill="#78350f">Most centres cap resubmissions at Pass grade, so aim for Merit or Distinction on the first submission.</text><text x="42" y="381.6" font-size="11.5" fill="#78350f">Policies vary: check with your centre.</text><text x="732" y="427.1" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI assignment resubmission</text></svg>
