<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect x="0.8" y="0.8" width="758.5" height="418.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">Ethical Theories Compared (CMI 706)</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">Four frameworks, each with a strength and a limit in leadership</text><clipPath id="tc39"><rect x="28" y="84.6" width="704" height="293.1" rx="10"/></clipPath><g clip-path="url(#tc39)"><rect x="28" y="84.6" width="704" height="293.1" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="28" y="84.6" width="120.7" height="43" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="35" y="101.6" font-size="11" fill="#fff" font-weight="700">Framework</text><rect x="148.7" y="84.6" width="150.9" height="43" rx="0" fill="#1e3a5f" stroke="none" stroke-width="1"/><text x="155.7" y="101.6" font-size="11" fill="#fff" font-weight="700">Basis for ethical</text><text x="155.7" y="116.1" font-size="11" fill="#fff" font-weight="700">judgement</text><rect x="299.5" y="84.6" width="100.6" height="43" rx="0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="306.5" y="101.6" font-size="11" fill="#fff" font-weight="700">Key theorists</text><rect x="400.1" y="84.6" width="160.9" height="43" rx="0" fill="#15803d" stroke="none" stroke-width="1"/><text x="407.1" y="101.6" font-size="11" fill="#fff" font-weight="700">Strength in leadership</text><rect x="561" y="84.6" width="171" height="43" rx="0" fill="#b45309" stroke="none" stroke-width="1"/><text x="568" y="101.6" font-size="11" fill="#fff" font-weight="700">Critical limitation</text><text x="35" y="144.2" font-size="10.5" fill="#1a2e4a" font-weight="700">Consequentialism</text><text x="35" y="158" font-size="10.5" fill="#1a2e4a" font-weight="700">/ Utilitarianism</text><text x="155.7" y="144.2" font-size="10.5" fill="#1f2937">The consequences of an</text><text x="155.7" y="158" font-size="10.5" fill="#1f2937">action: the greatest</text><text x="155.7" y="171.9" font-size="10.5" fill="#1f2937">good for the greatest</text><text x="155.7" y="185.7" font-size="10.5" fill="#1f2937">number</text><text x="306.5" y="144.2" font-size="10.5" fill="#1f2937">Bentham, Mill</text><text x="407.1" y="144.2" font-size="10.5" fill="#1f2937">Outcome focus suits</text><text x="407.1" y="158" font-size="10.5" fill="#1f2937">strategic trade-offs</text><text x="568" y="144.2" font-size="10.5" fill="#1f2937">Consequences are uncertain.</text><text x="568" y="158" font-size="10.5" fill="#1f2937">Can justify harm to</text><text x="568" y="171.9" font-size="10.5" fill="#1f2937">minorities. Open to</text><text x="568" y="185.7" font-size="10.5" fill="#1f2937">motivated reasoning</text><line x1="28" y1="127.7" x2="732" y2="127.7" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="197.1" width="704" height="55.6" rx="0" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="35" y="213.6" font-size="10.5" fill="#1a2e4a" font-weight="700">Deontological</text><text x="35" y="227.5" font-size="10.5" fill="#1a2e4a" font-weight="700">ethics</text><text x="155.7" y="213.6" font-size="10.5" fill="#1f2937">Duty and universal</text><text x="155.7" y="227.5" font-size="10.5" fill="#1f2937">principles, not</text><text x="155.7" y="241.3" font-size="10.5" fill="#1f2937">outcomes</text><text x="306.5" y="213.6" font-size="10.5" fill="#1f2937">Kant</text><text x="407.1" y="213.6" font-size="10.5" fill="#1f2937">Clear principles resist</text><text x="407.1" y="227.5" font-size="10.5" fill="#1f2937">rationalisation and</text><text x="407.1" y="241.3" font-size="10.5" fill="#1f2937">protect individual rights</text><text x="568" y="213.6" font-size="10.5" fill="#1f2937">Paralysis when duties</text><text x="568" y="227.5" font-size="10.5" fill="#1f2937">conflict.</text><text x="568" y="241.3" font-size="10.5" fill="#1f2937">Context-independent</text><line x1="28" y1="197.1" x2="732" y2="197.1" stroke="#e5e7eb" stroke-width="1"/><text x="35" y="269.2" font-size="10.5" fill="#1a2e4a" font-weight="700">Virtue ethics</text><text x="155.7" y="269.2" font-size="10.5" fill="#1f2937">Character: what kind of</text><text x="155.7" y="283" font-size="10.5" fill="#1f2937">leader to be</text><text x="306.5" y="269.2" font-size="10.5" fill="#1f2937">Aristotle,</text><text x="306.5" y="283" font-size="10.5" fill="#1f2937">MacIntyre</text><text x="407.1" y="269.2" font-size="10.5" fill="#1f2937">Builds character and</text><text x="407.1" y="283" font-size="10.5" fill="#1f2937">contextual judgement</text><text x="407.1" y="296.9" font-size="10.5" fill="#1f2937">(phronesis)</text><text x="568" y="269.2" font-size="10.5" fill="#1f2937">Which virtues? Little help</text><text x="568" y="283" font-size="10.5" fill="#1f2937">in specific dilemmas. Can</text><text x="568" y="296.9" font-size="10.5" fill="#1f2937">reinforce existing norms</text><line x1="28" y1="252.7" x2="732" y2="252.7" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="308.3" width="704" height="69.4" rx="0" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="35" y="324.8" font-size="10.5" fill="#1a2e4a" font-weight="700">Care ethics</text><text x="155.7" y="324.8" font-size="10.5" fill="#1f2937">Relationships and</text><text x="155.7" y="338.6" font-size="10.5" fill="#1f2937">responsibility to</text><text x="155.7" y="352.5" font-size="10.5" fill="#1f2937">particular others</text><text x="306.5" y="324.8" font-size="10.5" fill="#1f2937">Gilligan</text><text x="407.1" y="324.8" font-size="10.5" fill="#1f2937">Captures duties to</text><text x="407.1" y="338.6" font-size="10.5" fill="#1f2937">specific people.</text><text x="407.1" y="352.5" font-size="10.5" fill="#1f2937">Challenges claimed</text><text x="407.1" y="366.3" font-size="10.5" fill="#1f2937">objectivity</text><text x="568" y="324.8" font-size="10.5" fill="#1f2937">Can justify favouritism.</text><text x="568" y="338.6" font-size="10.5" fill="#1f2937">Hard at scale. Tension with</text><text x="568" y="352.5" font-size="10.5" fill="#1f2937">equal treatment law</text><line x1="28" y1="308.3" x2="732" y2="308.3" stroke="#e5e7eb" stroke-width="1"/><line x1="148.7" y1="127.7" x2="148.7" y2="377.7" stroke="#e5e7eb" stroke-width="1"/><line x1="299.5" y1="127.7" x2="299.5" y2="377.7" stroke="#e5e7eb" stroke-width="1"/><line x1="400.1" y1="127.7" x2="400.1" y2="377.7" stroke="#e5e7eb" stroke-width="1"/><line x1="561" y1="127.7" x2="561" y2="377.7" stroke="#e5e7eb" stroke-width="1"/></g><rect x="28" y="84.6" width="704" height="293.1" rx="10" fill="none" stroke="#e5e7eb" stroke-width="1.5"/><text x="732" y="402.2" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI Unit 706 assignment help</text></svg>
