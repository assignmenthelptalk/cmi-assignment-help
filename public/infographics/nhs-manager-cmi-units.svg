<rect y="40" width="960" height="8" fill="#1a2e4a"/>
<text x="480" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="white" letter-spacing="0.3">CMI Units Most Relevant for NHS Managers</text>

<!-- LEFT PANEL: Level 5 -->
<rect x="8" y="56" width="458" height="356" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>

