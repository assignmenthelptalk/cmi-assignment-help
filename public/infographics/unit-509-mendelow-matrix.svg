<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" width="760" height="474" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect x="0.8" y="0.8" width="758.5" height="472.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">Mendelow's Power/Interest Matrix</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">Position each stakeholder, then choose the engagement approach</text><rect x="74" y="84.6" width="325" height="118" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/><text x="84" y="106.1" font-size="12.5" fill="#78350f" font-weight="700">Keep Satisfied</text><text x="84" y="122.6" font-size="11" fill="#78350f">High power, low interest. Communicate proactively</text><text x="84" y="136.9" font-size="11" fill="#78350f">so concerns do not turn into opposition.</text><rect x="407" y="84.6" width="325" height="118" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/><text x="417" y="106.1" font-size="12.5" fill="#1e3a8a" font-weight="700">Manage Closely</text><text x="417" y="122.6" font-size="11" fill="#1e3a8a">High power, high interest. Frequent two-way</text><text x="417" y="136.9" font-size="11" fill="#1e3a8a">engagement, involving them in decisions.</text><rect x="417" y="173.6" width="65.6" height="19" rx="9.5" fill="#2563eb" stroke="none" stroke-width="1"/><text x="449.8" y="186.5" font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle">PRIORITY</text><rect x="74" y="210.6" width="325" height="118" rx="10" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1.5"/><text x="84" y="232.1" font-size="12.5" fill="#1f2937" font-weight="700">Monitor</text><text x="84" y="248.6" font-size="11" fill="#1f2937">Low power, low interest. Periodic monitoring to</text><text x="84" y="262.9" font-size="11" fill="#1f2937">see whether their position shifts.</text><rect x="407" y="210.6" width="325" height="118" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><text x="417" y="232.1" font-size="12.5" fill="#14532d" font-weight="700">Keep Informed</text><text x="417" y="248.6" font-size="11" fill="#14532d">Low power, high interest. Regular, clear and</text><text x="417" y="262.9" font-size="11" fill="#14532d">honest communication.</text><text transform="translate(62 143.6) rotate(-90)" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">High</text><text transform="translate(62 269.6) rotate(-90)" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">Low</text><text x="236.5" y="344.6" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">Low</text><text x="569.5" y="344.6" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="600">High</text><text transform="translate(36 206.6) rotate(-90)" font-size="12.5" fill="#1a2e4a" text-anchor="middle" font-weight="700">Power</text><text x="403" y="364.6" font-size="12.5" fill="#1a2e4a" text-anchor="middle" font-weight="700">Interest</text><rect x="28" y="378.6" width="704" height="52.4" rx="10" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5"/><text x="42" y="400.6" font-size="12" fill="#1a2e4a" font-weight="700">Positions are not fixed: a Monitor stakeholder can move to Manage Closely when a decision</text><text x="42" y="416.8" font-size="12" fill="#1a2e4a" font-weight="700">activates their interest.</text><text x="732" y="455.5" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI Unit 509 assignment help</text></svg>
