<text x="300" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e4a">Managing Stakeholder Relationships</text>
<text x="300" y="329" text-anchor="middle" font-size="10" fill="#6b7280">CQC, commissioners, unions, patients — NHS has one of the most complex stakeholder maps</text>

