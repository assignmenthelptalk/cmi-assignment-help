<text x="300" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e4a">Managing Wellbeing in the Workplace</text>
<text x="300" y="392" text-anchor="middle" font-size="10" fill="#6b7280">Staff wellbeing in high-pressure NHS clinical environments</text>

