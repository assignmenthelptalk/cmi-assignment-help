<text x="300" y="186" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e4a">Developing, Managing and Leading Teams</text>
<text x="300" y="201" text-anchor="middle" font-size="10" fill="#6b7280">Team dynamics in clinical environments — Tuckman, Belbin, psychological safety</text>

