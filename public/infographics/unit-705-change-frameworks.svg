<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect x="0.8" y="0.8" width="758.5" height="428.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">Change Management Frameworks Compared (CMI 705)</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">Critically Analyse each framework: do not simply apply it</text><clipPath id="tc38"><rect x="28" y="84.6" width="704" height="279.2" rx="10"/></clipPath><g clip-path="url(#tc38)"><rect x="28" y="84.6" width="704" height="279.2" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="28" y="84.6" width="119.1" height="43" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="35" y="101.6" font-size="11" fill="#fff" font-weight="700">Framework</text><rect x="147.1" y="84.6" width="97.5" height="43" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="154.1" y="101.6" font-size="11" fill="#fff" font-weight="700">Level of</text><text x="154.1" y="116.1" font-size="11" fill="#fff" font-weight="700">analysis</text><rect x="244.6" y="84.6" width="173.3" height="43" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="251.6" y="101.6" font-size="11" fill="#fff" font-weight="700">Evidence and standing</text><rect x="417.9" y="84.6" width="173.3" height="43" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="424.9" y="101.6" font-size="11" fill="#fff" font-weight="700">Assumption challenged at</text><text x="424.9" y="116.1" font-size="11" fill="#fff" font-weight="700">Level 7</text><rect x="591.2" y="84.6" width="140.8" height="43" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="598.2" y="101.6" font-size="11" fill="#fff" font-weight="700">Strategic</text><text x="598.2" y="116.1" font-size="11" fill="#fff" font-weight="700">application</text><text x="35" y="144.2" font-size="10.5" fill="#1a2e4a" font-weight="700">Kotter 8-Step</text><text x="154.1" y="144.2" font-size="10.5" fill="#1f2937">Organisation</text><text x="251.6" y="144.2" font-size="10.5" fill="#1f2937">Weakly evidenced. Built</text><text x="251.6" y="158" font-size="10.5" fill="#1f2937">from failed programmes. The</text><text x="251.6" y="171.9" font-size="10.5" fill="#1f2937">&quot;70% fail&quot; figure lacks</text><text x="251.6" y="185.7" font-size="10.5" fill="#1f2937">primary data</text><text x="424.9" y="144.2" font-size="10.5" fill="#1f2937">That a small coalition can</text><text x="424.9" y="158" font-size="10.5" fill="#1f2937">design a vision the</text><text x="424.9" y="171.9" font-size="10.5" fill="#1f2937">organisation adopts, and</text><text x="424.9" y="185.7" font-size="10.5" fill="#1f2937">that culture comes last</text><text x="598.2" y="144.2" font-size="10.5" fill="#1f2937">Planned,</text><text x="598.2" y="158" font-size="10.5" fill="#1f2937">leader-driven change</text><text x="598.2" y="171.9" font-size="10.5" fill="#1f2937">programmes</text><line x1="28" y1="127.7" x2="732" y2="127.7" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="197.1" width="704" height="55.6" rx="0" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="35" y="213.6" font-size="10.5" fill="#1a2e4a" font-weight="700">Lewin Force</text><text x="35" y="227.5" font-size="10.5" fill="#1a2e4a" font-weight="700">Field and Freeze</text><text x="154.1" y="213.6" font-size="10.5" fill="#1f2937">Group and</text><text x="154.1" y="227.5" font-size="10.5" fill="#1f2937">organisation</text><text x="251.6" y="213.6" font-size="10.5" fill="#1f2937">Practically useful. The</text><text x="251.6" y="227.5" font-size="10.5" fill="#1f2937">refreezing idea is heavily</text><text x="251.6" y="241.3" font-size="10.5" fill="#1f2937">critiqued (Burnes, 2004)</text><text x="424.9" y="213.6" font-size="10.5" fill="#1f2937">Stable, identifiable forces</text><text x="424.9" y="227.5" font-size="10.5" fill="#1f2937">and a refrozen end state</text><text x="598.2" y="213.6" font-size="10.5" fill="#1f2937">Diagnosing driving</text><text x="598.2" y="227.5" font-size="10.5" fill="#1f2937">and restraining</text><text x="598.2" y="241.3" font-size="10.5" fill="#1f2937">forces</text><line x1="28" y1="197.1" x2="732" y2="197.1" stroke="#e5e7eb" stroke-width="1"/><text x="35" y="269.2" font-size="10.5" fill="#1a2e4a" font-weight="700">ADKAR</text><text x="154.1" y="269.2" font-size="10.5" fill="#1f2937">Individual</text><text x="251.6" y="269.2" font-size="10.5" fill="#1f2937">A diagnostic for individual</text><text x="251.6" y="283" font-size="10.5" fill="#1f2937">adoption barriers. Limited</text><text x="251.6" y="296.9" font-size="10.5" fill="#1f2937">at system level</text><text x="424.9" y="269.2" font-size="10.5" fill="#1f2937">That organisational change</text><text x="424.9" y="283" font-size="10.5" fill="#1f2937">is the sum of individual</text><text x="424.9" y="296.9" font-size="10.5" fill="#1f2937">changes</text><text x="598.2" y="269.2" font-size="10.5" fill="#1f2937">Implementation and</text><text x="598.2" y="283" font-size="10.5" fill="#1f2937">workforce adoption</text><line x1="28" y1="252.7" x2="732" y2="252.7" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="308.3" width="704" height="55.6" rx="0" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="35" y="324.8" font-size="10.5" fill="#1a2e4a" font-weight="700">Complexity</text><text x="35" y="338.6" font-size="10.5" fill="#1a2e4a" font-weight="700">theory (Stacey)</text><text x="154.1" y="324.8" font-size="10.5" fill="#1f2937">System</text><text x="251.6" y="324.8" font-size="10.5" fill="#1f2937">A conceptual challenge</text><text x="251.6" y="338.6" font-size="10.5" fill="#1f2937">drawn from complexity</text><text x="251.6" y="352.5" font-size="10.5" fill="#1f2937">science</text><text x="424.9" y="324.8" font-size="10.5" fill="#1f2937">That change can be</text><text x="424.9" y="338.6" font-size="10.5" fill="#1f2937">diagnosed, designed and</text><text x="424.9" y="352.5" font-size="10.5" fill="#1f2937">controlled in advance</text><text x="598.2" y="324.8" font-size="10.5" fill="#1f2937">Emergent, uncertain,</text><text x="598.2" y="338.6" font-size="10.5" fill="#1f2937">expert-led settings</text><line x1="28" y1="308.3" x2="732" y2="308.3" stroke="#e5e7eb" stroke-width="1"/><line x1="147.1" y1="127.7" x2="147.1" y2="363.8" stroke="#e5e7eb" stroke-width="1"/><line x1="244.6" y1="127.7" x2="244.6" y2="363.8" stroke="#e5e7eb" stroke-width="1"/><line x1="417.9" y1="127.7" x2="417.9" y2="363.8" stroke="#e5e7eb" stroke-width="1"/><line x1="591.2" y1="127.7" x2="591.2" y2="363.8" stroke="#e5e7eb" stroke-width="1"/></g><rect x="28" y="84.6" width="704" height="279.2" rx="10" fill="none" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="383.3" font-size="11.5" fill="#1a2e4a" font-weight="700">CMI 705 AC1 requires critical analysis of each framework, not application.</text><text x="732" y="411.9" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI Unit 705 assignment help</text></svg>
