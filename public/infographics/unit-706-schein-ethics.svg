<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 554" width="760" height="554" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect x="0.8" y="0.8" width="758.5" height="552.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">Schein Culture Model Applied to Ethics (CMI 706)</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">Where ethical culture is embedded, or undermined, at each level</text><circle cx="198" cy="256.625" r="164" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="198" cy="256.625" r="112" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><circle cx="198" cy="256.625" r="60" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="198" y="127.6" font-size="13" fill="#1e3a8a" font-weight="700" text-anchor="middle">Artefacts</text><text x="198" y="179.6" font-size="13" fill="#78350f" font-weight="700" text-anchor="middle">Espoused Values</text><text x="198" y="256.1" font-size="11.5" fill="#7f1d1d" font-weight="700" text-anchor="middle">Underlying</text><text x="198" y="269.9" font-size="11.5" fill="#7f1d1d" font-weight="700" text-anchor="middle">Assumptions</text><rect x="390" y="84.6" width="342" height="107" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="390" y="84.6" width="8" height="107" rx="0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="408" y="107.6" font-size="13" fill="#1e3a8a" font-weight="700">Artefacts</text><text x="408" y="125.2" font-size="11" fill="#6b7280" font-style="italic">Visible structures and behaviours</text><text x="408" y="142.5" font-size="11.5" fill="#1f2937">Codes of conduct, ethics training, whistleblowing</text><text x="408" y="158.1" font-size="11.5" fill="#1f2937">hotlines, ethics reporting procedures, values on</text><text x="408" y="173.6" font-size="11.5" fill="#1f2937">office walls.</text><rect x="390" y="201.6" width="342" height="107" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="390" y="201.6" width="8" height="107" rx="0" fill="#b45309" stroke="none" stroke-width="1"/><text x="408" y="224.6" font-size="13" fill="#78350f" font-weight="700">Espoused Values</text><text x="408" y="242.2" font-size="11" fill="#6b7280" font-style="italic">Stated strategies and goals</text><text x="408" y="259.5" font-size="11.5" fill="#1f2937">Mission statements, ethics policies, leadership</text><text x="408" y="275" font-size="11.5" fill="#1f2937">messages about values, corporate responsibility</text><text x="408" y="290.6" font-size="11.5" fill="#1f2937">reports.</text><rect x="390" y="318.6" width="342" height="122.5" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="390" y="318.6" width="8" height="122.5" rx="0" fill="#b91c1c" stroke="none" stroke-width="1"/><text x="408" y="341.6" font-size="13" fill="#7f1d1d" font-weight="700">Underlying Assumptions</text><text x="408" y="359.1" font-size="11" fill="#6b7280" font-style="italic">Taken-for-granted beliefs</text><text x="408" y="376.5" font-size="11.5" fill="#1f2937">What leaders actually reward and sanction, how</text><text x="408" y="392" font-size="11.5" fill="#1f2937">decisions are really made, what is tolerated</text><text x="408" y="407.5" font-size="11.5" fill="#1f2937">under pressure, what the organisation truly</text><text x="408" y="423.1" font-size="11.5" fill="#1f2937">values.</text><rect x="28" y="459.1" width="704" height="52.4" rx="10" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5"/><text x="42" y="481.1" font-size="12" fill="#1a2e4a" font-weight="700">Ethical culture is embedded at the level of underlying assumptions, not at the level of</text><text x="42" y="497.3" font-size="12" fill="#1a2e4a" font-weight="700">artefacts.</text><text x="732" y="536" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI Unit 706 assignment help</text></svg>
