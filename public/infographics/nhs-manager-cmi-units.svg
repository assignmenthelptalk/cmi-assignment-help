<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
<defs><style>text{font-family:Inter,system-ui,-apple-system,sans-serif}</style></defs>

<!-- outer card -->
<rect width="960" height="420" rx="8" fill="#f9fafb"/>
<rect width="960" height="420" rx="8" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>

<!-- title bar -->
