<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 554" width="760" height="554" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect x="0.8" y="0.8" width="758.5" height="552.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">The Five Most Common Reasons for a CMI Refer</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">Each one comes with the assessor wording to expect and the fix</text><rect x="28" y="84.6" width="704" height="75.3" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="28" y="84.6" width="8" height="75.3" rx="0" fill="#b91c1c" stroke="none" stroke-width="1"/><circle cx="64" cy="122.2625" r="17" fill="#b91c1c"/><text x="64" y="129.2625" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="90" y="108.1" font-size="13.5" fill="#1a2e4a" font-weight="700">Command verb not met</text><text x="90" y="126.3" font-size="11.5" fill="#6b7280" font-style="italic">&quot;You have described X but have not evaluated it.&quot;</text><text x="90" y="143.9" font-size="11.5" fill="#1f2937">Fix: Re-read the verb for each criterion and check every section works at that depth.</text><rect x="28" y="169.9" width="704" height="75.3" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="28" y="169.9" width="8" height="75.3" rx="0" fill="#b45309" stroke="none" stroke-width="1"/><circle cx="64" cy="207.53750000000002" r="17" fill="#b45309"/><text x="64" y="214.53750000000002" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="90" y="193.4" font-size="13.5" fill="#1a2e4a" font-weight="700">Assessment criteria not addressed</text><text x="90" y="211.6" font-size="11.5" fill="#6b7280" font-style="italic">&quot;Your response to AC2 does not address [specific element].&quot;</text><text x="90" y="229.2" font-size="11.5" fill="#1f2937">Fix: Annotate your work against each AC and write any missing section.</text><rect x="28" y="255.2" width="704" height="75.3" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="28" y="255.2" width="8" height="75.3" rx="0" fill="#2563eb" stroke="none" stroke-width="1"/><circle cx="64" cy="292.8125" r="17" fill="#2563eb"/><text x="64" y="299.8125" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="90" y="278.7" font-size="13.5" fill="#1a2e4a" font-weight="700">Insufficient evidence-based referencing</text><text x="90" y="296.9" font-size="11.5" fill="#6b7280" font-style="italic">&quot;Your work needs stronger academic evidence.&quot;</text><text x="90" y="314.4" font-size="11.5" fill="#1f2937">Fix: Add in-text citations. At Level 7, add peer-reviewed journal sources.</text><rect x="28" y="340.5" width="704" height="75.3" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="28" y="340.5" width="8" height="75.3" rx="0" fill="#6d28d9" stroke="none" stroke-width="1"/><circle cx="64" cy="378.08750000000003" r="17" fill="#6d28d9"/><text x="64" y="385.08750000000003" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="90" y="364" font-size="13.5" fill="#1a2e4a" font-weight="700">Framework applied rather than analysed</text><text x="90" y="382.2" font-size="11.5" fill="#6b7280" font-style="italic">&quot;You have applied the model but have not evaluated the framework itself.&quot;</text><text x="90" y="399.7" font-size="11.5" fill="#1f2937">Fix: Add each framework's limitations, assumptions and what a critic would argue.</text><rect x="28" y="425.7" width="704" height="75.3" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><rect x="28" y="425.7" width="8" height="75.3" rx="0" fill="#0f766e" stroke="none" stroke-width="1"/><circle cx="64" cy="463.3625" r="17" fill="#0f766e"/><text x="64" y="470.3625" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="90" y="449.2" font-size="13.5" fill="#1a2e4a" font-weight="700">AC3 underdeveloped</text><text x="90" y="467.5" font-size="11.5" fill="#6b7280" font-style="italic">&quot;AC3 requires further development.&quot;</text><text x="90" y="485" font-size="11.5" fill="#1f2937">Fix: Give AC3 roughly the same depth as AC1 and AC2.</text><text x="732" y="535.5" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI assignment resubmission</text></svg>
