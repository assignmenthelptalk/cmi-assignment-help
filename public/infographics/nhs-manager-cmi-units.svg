<rect x="504" y="232" width="438" height="56" rx="5" fill="white" stroke="#c7d2fe" stroke-width="1"/>
<rect x="504" y="232" width="4" height="56" rx="2" fill="#6366f1"/>
<rect x="516" y="242" width="52" height="20" rx="10" fill="#eef2ff"/>
<text x="542" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#3730a3">CMI 704</text>
<text x="735" y="250" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e4a">Developing Organisational Strategy</text>
<text x="735" y="265" text-anchor="middle" font-size="10" fill="#6b7280">PESTLE, Porter, VRIN analysis adapted for NHS — ICS strategy and system integration</text>

<!-- Unit 705 -->
<rect x="504" y="296" width="438" height="56" rx="5" fill="white" stroke="#c7d2fe" stroke-width="1"/>
<rect x="504" y="296" width="4" height="56" rx="2" fill="#6366f1"/>
<rect x="516" y="306" width="52" height="20" rx="10" fill="#eef2ff"/>
<text x="542" y="320" text-anchor="middle" font-size="10" font-weight="700" fill="#3730a3">CMI 705</text>
<text x="735" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e4a">Leading Strategic Change</text>
<text x="735" y="329" text-anchor="middle" font-size="10" fill="#6b7280">Kotter vs NHS complexity, digital transformation, ICS service redesign programmes</text>

