<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect x="0.8" y="0.8" width="758.5" height="528.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">CMI Resubmission Checklist</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">Ten steps from reading the feedback to final submission</text><text x="28" y="95.1" font-size="10.5" fill="#15803d" font-weight="700">BEFORE YOU START</text><line x1="28" y1="102.8" x2="732" y2="102.8" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="112.8" width="20" height="20" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><g transform="translate(31.5 116.3) scale(0.5)" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="58" y="126.2" font-size="12.5" fill="#1f2937">Read the assessor feedback in full before changing anything</text><rect x="28" y="142.8" width="20" height="20" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><g transform="translate(31.5 146.3) scale(0.5)" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="58" y="156.2" font-size="12.5" fill="#1f2937">Map each piece of feedback to the place it applies in your submission</text><text x="28" y="189.3" font-size="10.5" fill="#15803d" font-weight="700">WHILE REVISING</text><line x1="28" y1="197" x2="732" y2="197" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="207" width="20" height="20" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><g transform="translate(31.5 210.5) scale(0.5)" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="58" y="220.4" font-size="12.5" fill="#1f2937">Write any missing sections first</text><rect x="28" y="237" width="20" height="20" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><g transform="translate(31.5 240.5) scale(0.5)" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="58" y="250.4" font-size="12.5" fill="#1f2937">Revisit the command verb in every flagged section</text><rect x="28" y="267" width="20" height="20" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><g transform="translate(31.5 270.5) scale(0.5)" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="58" y="280.4" font-size="12.5" fill="#1f2937">Add peer-reviewed sources with in-text citations</text><rect x="28" y="297" width="20" height="20" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><g transform="translate(31.5 300.5) scale(0.5)" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="58" y="310.4" font-size="12.5" fill="#1f2937">Check every recommendation is SMART</text><rect x="28" y="327" width="20" height="20" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><g transform="translate(31.5 330.5) scale(0.5)" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="58" y="340.4" font-size="12.5" fill="#1f2937">Balance the word count across the criteria</text><text x="28" y="373.5" font-size="10.5" fill="#15803d" font-weight="700">BEFORE SUBMITTING</text><line x1="28" y1="381.2" x2="732" y2="381.2" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="391.2" width="20" height="20" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><g transform="translate(31.5 394.7) scale(0.5)" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="58" y="404.5" font-size="12.5" fill="#1f2937">Confirm each gap in the feedback is now closed</text><rect x="28" y="421.2" width="20" height="20" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><g transform="translate(31.5 424.7) scale(0.5)" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="58" y="434.5" font-size="12.5" fill="#1f2937">Check Harvard referencing and the word count</text><rect x="28" y="451.2" width="20" height="20" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><g transform="translate(31.5 454.7) scale(0.5)" fill="none" stroke="#15803d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="58" y="464.5" font-size="12.5" fill="#1f2937">Check your centre's resubmission rules and grade cap</text><text x="732" y="511.7" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI assignment resubmission</text></svg>
