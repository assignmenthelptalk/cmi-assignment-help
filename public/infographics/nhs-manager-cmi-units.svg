<text x="735" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e4a">Strategic Leadership</text>
<text x="735" y="137" text-anchor="middle" font-size="10" fill="#6b7280">ICS transformation, CQC governance — Critically Analyse at directorate and board level</text>

<!-- Unit 702 -->
<rect x="504" y="168" width="438" height="56" rx="5" fill="white" stroke="#c7d2fe" stroke-width="1"/>
<rect x="504" y="168" width="4" height="56" rx="2" fill="#6366f1"/>
<rect x="516" y="178" width="52" height="20" rx="10" fill="#eef2ff"/>
<text x="542" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#3730a3">CMI 702</text>
<text x="735" y="186" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e4a">Leading and Developing People</text>
<text x="735" y="201" text-anchor="middle" font-size="10" fill="#6b7280">NHS Long Term Workforce Plan, talent strategy, Senge learning organisation model</text>

