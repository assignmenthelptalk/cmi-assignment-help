<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 614" width="760" height="614" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect x="0.8" y="0.8" width="758.5" height="612.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">Kotter's 8-Step Change Model: Level 7 Critique</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">Where the strongest empirical limitations sit</text><defs><marker id="kt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a2e4a"/></marker></defs><rect x="28" y="84.6" width="165.5" height="76" rx="12" fill="#1a2e4a" stroke="none" stroke-width="1"/><circle cx="50" cy="106.6" r="13" fill="#fff"/><text x="50" y="111.6" font-size="13" font-weight="700" fill="#1a2e4a" text-anchor="middle">1</text><text x="70" y="106.6" font-size="12" fill="#fff" font-weight="700">Establish</text><text x="70" y="121.6" font-size="12" fill="#fff" font-weight="700">urgency</text><line x1="194.5" y1="122.6" x2="206.5" y2="122.6" stroke="#1a2e4a" stroke-width="2.5" marker-end="url(#kt-arrow)"/><rect x="207.5" y="84.6" width="165.5" height="76" rx="12" fill="#1a2e4a" stroke="none" stroke-width="1"/><circle cx="229.5" cy="106.6" r="13" fill="#fff"/><text x="229.5" y="111.6" font-size="13" font-weight="700" fill="#1a2e4a" text-anchor="middle">2</text><text x="249.5" y="106.6" font-size="12" fill="#fff" font-weight="700">Form a guiding</text><text x="249.5" y="121.6" font-size="12" fill="#fff" font-weight="700">coalition</text><line x1="374" y1="122.6" x2="386" y2="122.6" stroke="#1a2e4a" stroke-width="2.5" marker-end="url(#kt-arrow)"/><rect x="387" y="84.6" width="165.5" height="76" rx="12" fill="#1a2e4a" stroke="none" stroke-width="1"/><circle cx="409" cy="106.6" r="13" fill="#fff"/><text x="409" y="111.6" font-size="13" font-weight="700" fill="#1a2e4a" text-anchor="middle">3</text><text x="429" y="106.6" font-size="12" fill="#fff" font-weight="700">Develop a</text><text x="429" y="121.6" font-size="12" fill="#fff" font-weight="700">vision and</text><text x="429" y="136.6" font-size="12" fill="#fff" font-weight="700">strategy</text><line x1="553.5" y1="122.6" x2="565.5" y2="122.6" stroke="#1a2e4a" stroke-width="2.5" marker-end="url(#kt-arrow)"/><rect x="566.5" y="84.6" width="165.5" height="76" rx="12" fill="#1a2e4a" stroke="none" stroke-width="1"/><circle cx="588.5" cy="106.6" r="13" fill="#fff"/><text x="588.5" y="111.6" font-size="13" font-weight="700" fill="#1a2e4a" text-anchor="middle">4</text><text x="608.5" y="106.6" font-size="12" fill="#fff" font-weight="700">Communicate the</text><text x="608.5" y="121.6" font-size="12" fill="#fff" font-weight="700">vision</text><rect x="28" y="312.9" width="165.5" height="76" rx="12" fill="#1a2e4a" stroke="none" stroke-width="1"/><circle cx="50" cy="334.9" r="13" fill="#fff"/><text x="50" y="339.9" font-size="13" font-weight="700" fill="#1a2e4a" text-anchor="middle">5</text><text x="70" y="334.9" font-size="12" fill="#fff" font-weight="700">Empower</text><text x="70" y="349.9" font-size="12" fill="#fff" font-weight="700">broad-based</text><text x="70" y="364.9" font-size="12" fill="#fff" font-weight="700">action</text><line x1="194.5" y1="350.9" x2="206.5" y2="350.9" stroke="#1a2e4a" stroke-width="2.5" marker-end="url(#kt-arrow)"/><rect x="207.5" y="312.9" width="165.5" height="76" rx="12" fill="#1a2e4a" stroke="none" stroke-width="1"/><circle cx="229.5" cy="334.9" r="13" fill="#fff"/><text x="229.5" y="339.9" font-size="13" font-weight="700" fill="#1a2e4a" text-anchor="middle">6</text><text x="249.5" y="334.9" font-size="12" fill="#fff" font-weight="700">Generate</text><text x="249.5" y="349.9" font-size="12" fill="#fff" font-weight="700">short-term wins</text><line x1="374" y1="350.9" x2="386" y2="350.9" stroke="#1a2e4a" stroke-width="2.5" marker-end="url(#kt-arrow)"/><rect x="387" y="312.9" width="165.5" height="76" rx="12" fill="#1a2e4a" stroke="none" stroke-width="1"/><circle cx="409" cy="334.9" r="13" fill="#fff"/><text x="409" y="339.9" font-size="13" font-weight="700" fill="#1a2e4a" text-anchor="middle">7</text><text x="429" y="334.9" font-size="12" fill="#fff" font-weight="700">Consolidate</text><text x="429" y="349.9" font-size="12" fill="#fff" font-weight="700">gains</text><line x1="553.5" y1="350.9" x2="565.5" y2="350.9" stroke="#1a2e4a" stroke-width="2.5" marker-end="url(#kt-arrow)"/><rect x="566.5" y="312.9" width="165.5" height="76" rx="12" fill="#1a2e4a" stroke="none" stroke-width="1"/><circle cx="588.5" cy="334.9" r="13" fill="#fff"/><text x="588.5" y="339.9" font-size="13" font-weight="700" fill="#1a2e4a" text-anchor="middle">8</text><text x="608.5" y="334.9" font-size="12" fill="#fff" font-weight="700">Anchor changes</text><text x="608.5" y="349.9" font-size="12" fill="#fff" font-weight="700">in culture</text><path d="M 649.3 160.6 V 296.9 H 110.8 V 309.9" fill="none" stroke="#1a2e4a" stroke-width="2.5" marker-end="url(#kt-arrow)"/><line x1="110.8" y1="160.6" x2="110.8" y2="172.6" stroke="#b45309" stroke-width="2"/><rect x="28" y="172.6" width="165.5" height="102.3" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><rect x="36" y="180.6" width="79.4" height="18" rx="9" fill="#b45309" stroke="none" stroke-width="1"/><text x="75.7" y="192.9" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">L7 CRITIQUE</text><text x="38" y="213.1" font-size="10.5" fill="#78350f">Manufactured urgency can</text><text x="38" y="226.8" font-size="10.5" fill="#78350f">cause anxiety rather than</text><text x="38" y="240.4" font-size="10.5" fill="#78350f">mobilisation (Edmondson,</text><text x="38" y="254.1" font-size="10.5" fill="#78350f">2018).</text><line x1="469.8" y1="160.6" x2="469.8" y2="172.6" stroke="#b45309" stroke-width="2"/><rect x="387" y="172.6" width="165.5" height="102.3" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><rect x="395" y="180.6" width="79.4" height="18" rx="9" fill="#b45309" stroke="none" stroke-width="1"/><text x="434.7" y="192.9" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">L7 CRITIQUE</text><text x="397" y="213.1" font-size="10.5" fill="#78350f">Assumes a small coalition</text><text x="397" y="226.8" font-size="10.5" fill="#78350f">can design a vision</text><text x="397" y="240.4" font-size="10.5" fill="#78350f">others adopt. Complexity</text><text x="397" y="254.1" font-size="10.5" fill="#78350f">theory disputes this</text><text x="397" y="267.7" font-size="10.5" fill="#78350f">(Stacey, 2001).</text><line x1="649.3" y1="388.9" x2="649.3" y2="400.9" stroke="#b45309" stroke-width="2"/><rect x="566.5" y="400.9" width="165.5" height="102.3" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><rect x="574.5" y="408.9" width="79.4" height="18" rx="9" fill="#b45309" stroke="none" stroke-width="1"/><text x="614.2" y="421.1" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">L7 CRITIQUE</text><text x="576.5" y="441.4" font-size="10.5" fill="#78350f">Culture enables or</text><text x="576.5" y="455" font-size="10.5" fill="#78350f">constrains change</text><text x="576.5" y="468.7" font-size="10.5" fill="#78350f">throughout. It is not a</text><text x="576.5" y="482.3" font-size="10.5" fill="#78350f">final step (Schein).</text><rect x="28" y="519.1" width="704" height="52.4" rx="10" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5"/><text x="42" y="541.1" font-size="12" fill="#1a2e4a" font-weight="700">CMI 705 AC1 requires Critically Analyse, not application. Identify which steps have the</text><text x="42" y="557.3" font-size="12" fill="#1a2e4a" font-weight="700">strongest empirical support and where the model fails in complex organisations.</text><text x="732" y="596" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI Unit 705 assignment help</text></svg>
