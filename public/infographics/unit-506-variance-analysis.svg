<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 391" width="760" height="391" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect x="0.8" y="0.8" width="758.5" height="389.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">CMI 506: Budget Variance Analysis</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">Illustrative figures showing an adverse and a favourable variance</text><clipPath id="tc34"><rect x="28" y="84.6" width="704" height="100.9" rx="10"/></clipPath><g clip-path="url(#tc34)"><rect x="28" y="84.6" width="704" height="100.9" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="28" y="84.6" width="214.8" height="33.2" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="37" y="104.1" font-size="11.5" fill="#fff" font-weight="700">Budget line</text><rect x="242.8" y="84.6" width="119.3" height="33.2" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="251.8" y="104.1" font-size="11.5" fill="#fff" font-weight="700">Budget</text><rect x="362.1" y="84.6" width="119.3" height="33.2" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="371.1" y="104.1" font-size="11.5" fill="#fff" font-weight="700">Actual</text><rect x="481.4" y="84.6" width="119.3" height="33.2" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="490.4" y="104.1" font-size="11.5" fill="#fff" font-weight="700">Variance</text><rect x="600.7" y="84.6" width="131.3" height="33.2" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="609.7" y="104.1" font-size="11.5" fill="#fff" font-weight="700">Result</text><text x="37" y="137.8" font-size="12" fill="#1a2e4a" font-weight="700">Agency staff costs</text><text x="251.8" y="137.8" font-size="12" fill="#1f2937">£120,000</text><text x="371.1" y="137.8" font-size="12" fill="#1f2937">£145,000</text><text x="490.4" y="137.8" font-size="12" fill="#1f2937">£25,000</text><rect x="600.7" y="117.8" width="131.3" height="33.8" rx="0" fill="#fee2e2" stroke="none" stroke-width="1"/><text x="609.7" y="137.8" font-size="12" fill="#b91c1c" font-weight="700">Adverse</text><line x1="28" y1="117.8" x2="732" y2="117.8" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="151.6" width="704" height="33.8" rx="0" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="37" y="171.6" font-size="12" fill="#1a2e4a" font-weight="700">Service income</text><text x="251.8" y="171.6" font-size="12" fill="#1f2937">£200,000</text><text x="371.1" y="171.6" font-size="12" fill="#1f2937">£215,000</text><text x="490.4" y="171.6" font-size="12" fill="#1f2937">£15,000</text><rect x="600.7" y="151.6" width="131.3" height="33.8" rx="0" fill="#dcfce7" stroke="none" stroke-width="1"/><text x="609.7" y="171.6" font-size="12" fill="#15803d" font-weight="700">Favourable</text><line x1="28" y1="151.6" x2="732" y2="151.6" stroke="#e5e7eb" stroke-width="1"/><line x1="242.8" y1="117.8" x2="242.8" y2="185.5" stroke="#e5e7eb" stroke-width="1"/><line x1="362.1" y1="117.8" x2="362.1" y2="185.5" stroke="#e5e7eb" stroke-width="1"/><line x1="481.4" y1="117.8" x2="481.4" y2="185.5" stroke="#e5e7eb" stroke-width="1"/><line x1="600.7" y1="117.8" x2="600.7" y2="185.5" stroke="#e5e7eb" stroke-width="1"/></g><rect x="28" y="84.6" width="704" height="100.9" rx="10" fill="none" stroke="#e5e7eb" stroke-width="1.5"/><rect x="28" y="201.5" width="345" height="80.4" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><text x="42" y="225.485" font-size="14" font-weight="700" fill="#15803d">Favourable variance</text><text x="42" y="247.5" font-size="12" fill="#1f2937">Actual is better than budget: lower cost or</text><text x="42" y="263.7" font-size="12" fill="#1f2937">higher income.</text><rect x="387" y="201.5" width="345" height="80.4" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/><text x="401" y="225.485" font-size="14" font-weight="700" fill="#b91c1c">Adverse variance</text><text x="401" y="247.5" font-size="12" fill="#1f2937">Actual is worse than budget: higher cost or</text><text x="401" y="263.7" font-size="12" fill="#1f2937">lower income.</text><rect x="28" y="295.9" width="704" height="52.4" rx="10" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5"/><text x="42" y="317.9" font-size="12" fill="#1a2e4a" font-weight="700">Management response: investigate the root cause. A controllable variance needs corrective</text><text x="42" y="334.1" font-size="12" fill="#1a2e4a" font-weight="700">action. An uncontrollable one may need a revised forecast or budget.</text><text x="732" y="372.8" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI Unit 506 assignment help</text></svg>
