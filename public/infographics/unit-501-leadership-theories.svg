<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 473" width="760" height="473" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect x="0.8" y="0.8" width="758.5" height="471.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">CMI 501: Leadership Theories Compared</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">Evaluate each theory against criteria. Do not simply describe it</text><clipPath id="tc32"><rect x="28" y="84.6" width="704" height="345.9" rx="10"/></clipPath><g clip-path="url(#tc32)"><rect x="28" y="84.6" width="704" height="345.9" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="28" y="84.6" width="107.6" height="43" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="35" y="101.6" font-size="11" fill="#fff" font-weight="700">Theory</text><rect x="135.6" y="84.6" width="166.2" height="43" rx="0" fill="#1e3a5f" stroke="none" stroke-width="1"/><text x="142.6" y="101.6" font-size="11" fill="#fff" font-weight="700">Theoretical focus</text><rect x="301.8" y="84.6" width="146.7" height="43" rx="0" fill="#15803d" stroke="none" stroke-width="1"/><text x="308.8" y="101.6" font-size="11" fill="#fff" font-weight="700">Evaluation criteria</text><text x="308.8" y="116.1" font-size="11" fill="#fff" font-weight="700">(examples)</text><rect x="448.4" y="84.6" width="146.7" height="43" rx="0" fill="#b45309" stroke="none" stroke-width="1"/><text x="455.4" y="101.6" font-size="11" fill="#fff" font-weight="700">Key limitation</text><rect x="595.1" y="84.6" width="136.9" height="43" rx="0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="602.1" y="101.6" font-size="11" fill="#fff" font-weight="700">Use in a 501</text><text x="602.1" y="116.1" font-size="11" fill="#fff" font-weight="700">response</text><text x="35" y="144.7" font-size="11" fill="#1a2e4a" font-weight="700">Transformational</text><text x="142.6" y="144.7" font-size="11" fill="#1f2937">Leaders inspire followers</text><text x="142.6" y="159.2" font-size="11" fill="#1f2937">beyond self-interest</text><text x="142.6" y="173.7" font-size="11" fill="#1f2937">through vision, values</text><text x="142.6" y="188.2" font-size="11" fill="#1f2937">and intellectual</text><text x="142.6" y="202.7" font-size="11" fill="#1f2937">stimulation</text><text x="308.8" y="144.7" font-size="11" fill="#1f2937">Staff motivation,</text><text x="308.8" y="159.2" font-size="11" fill="#1f2937">adaptability to</text><text x="308.8" y="173.7" font-size="11" fill="#1f2937">development needs,</text><text x="308.8" y="188.2" font-size="11" fill="#1f2937">performance</text><text x="455.4" y="144.7" font-size="11" fill="#1f2937">Heroic-leader bias</text><text x="455.4" y="159.2" font-size="11" fill="#1f2937">and cultural</text><text x="455.4" y="173.7" font-size="11" fill="#1f2937">dependency</text><text x="602.1" y="144.7" font-size="11" fill="#1f2937">Core AC2 evaluation,</text><text x="602.1" y="159.2" font-size="11" fill="#1f2937">set against</text><text x="602.1" y="173.7" font-size="11" fill="#1f2937">transactional</text><line x1="28" y1="127.7" x2="732" y2="127.7" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="214.3" width="704" height="72.1" rx="0" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="35" y="231.3" font-size="11" fill="#1a2e4a" font-weight="700">Transactional</text><text x="142.6" y="231.3" font-size="11" fill="#1f2937">An exchange: reward for</text><text x="142.6" y="245.8" font-size="11" fill="#1f2937">performance, correction</text><text x="142.6" y="260.3" font-size="11" fill="#1f2937">for failure</text><text x="308.8" y="231.3" font-size="11" fill="#1f2937">Task clarity,</text><text x="308.8" y="245.8" font-size="11" fill="#1f2937">compliance,</text><text x="308.8" y="260.3" font-size="11" fill="#1f2937">effectiveness in</text><text x="308.8" y="274.8" font-size="11" fill="#1f2937">stable settings</text><text x="455.4" y="231.3" font-size="11" fill="#1f2937">Less suited to</text><text x="455.4" y="245.8" font-size="11" fill="#1f2937">environments that</text><text x="455.4" y="260.3" font-size="11" fill="#1f2937">need change and</text><text x="455.4" y="274.8" font-size="11" fill="#1f2937">innovation</text><text x="602.1" y="231.3" font-size="11" fill="#1f2937">Show range by</text><text x="602.1" y="245.8" font-size="11" fill="#1f2937">pairing with</text><text x="602.1" y="260.3" font-size="11" fill="#1f2937">transformational</text><line x1="28" y1="214.3" x2="732" y2="214.3" stroke="#e5e7eb" stroke-width="1"/><text x="35" y="303.3" font-size="11" fill="#1a2e4a" font-weight="700">Situational</text><text x="142.6" y="303.3" font-size="11" fill="#1f2937">Style adapts to the</text><text x="142.6" y="317.9" font-size="11" fill="#1f2937">follower's development</text><text x="142.6" y="332.4" font-size="11" fill="#1f2937">level (Hersey and</text><text x="142.6" y="346.9" font-size="11" fill="#1f2937">Blanchard)</text><text x="308.8" y="303.3" font-size="11" fill="#1f2937">Applicability to</text><text x="308.8" y="317.9" font-size="11" fill="#1f2937">teams with mixed</text><text x="308.8" y="332.4" font-size="11" fill="#1f2937">experience</text><text x="455.4" y="303.3" font-size="11" fill="#1f2937">Oversimplifies</text><text x="455.4" y="317.9" font-size="11" fill="#1f2937">development into four</text><text x="455.4" y="332.4" font-size="11" fill="#1f2937">stages</text><text x="602.1" y="303.3" font-size="11" fill="#1f2937">Evaluate for a</text><text x="602.1" y="317.9" font-size="11" fill="#1f2937">defined team context</text><line x1="28" y1="286.3" x2="732" y2="286.3" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="358.4" width="704" height="72.1" rx="0" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="35" y="375.4" font-size="11" fill="#1a2e4a" font-weight="700">Contingency</text><text x="142.6" y="375.4" font-size="11" fill="#1f2937">Effectiveness depends on</text><text x="142.6" y="389.9" font-size="11" fill="#1f2937">the fit between leader</text><text x="142.6" y="404.5" font-size="11" fill="#1f2937">style and the situation</text><text x="142.6" y="419" font-size="11" fill="#1f2937">(Fiedler)</text><text x="308.8" y="375.4" font-size="11" fill="#1f2937">Fit between style and</text><text x="308.8" y="389.9" font-size="11" fill="#1f2937">context</text><text x="455.4" y="375.4" font-size="11" fill="#1f2937">Assumes style is</text><text x="455.4" y="389.9" font-size="11" fill="#1f2937">fixed, so the</text><text x="455.4" y="404.5" font-size="11" fill="#1f2937">situation must change</text><text x="602.1" y="375.4" font-size="11" fill="#1f2937">Shows how context</text><text x="602.1" y="389.9" font-size="11" fill="#1f2937">drives effectiveness</text><line x1="28" y1="358.4" x2="732" y2="358.4" stroke="#e5e7eb" stroke-width="1"/><line x1="135.6" y1="127.7" x2="135.6" y2="430.5" stroke="#e5e7eb" stroke-width="1"/><line x1="301.8" y1="127.7" x2="301.8" y2="430.5" stroke="#e5e7eb" stroke-width="1"/><line x1="448.4" y1="127.7" x2="448.4" y2="430.5" stroke="#e5e7eb" stroke-width="1"/><line x1="595.1" y1="127.7" x2="595.1" y2="430.5" stroke="#e5e7eb" stroke-width="1"/></g><rect x="28" y="84.6" width="704" height="345.9" rx="10" fill="none" stroke="#e5e7eb" stroke-width="1.5"/><text x="732" y="455" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI Unit 501 assignment help</text></svg>
