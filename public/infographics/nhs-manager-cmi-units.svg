<text x="300" y="250" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e4a">Managing Performance</text>
<text x="300" y="265" text-anchor="middle" font-size="10" fill="#6b7280">NHS appraisal, disciplinary frameworks, GROW coaching — directly maps to Band 7</text>

<!-- Unit 509 -->
<rect x="18" y="296" width="438" height="56" rx="5" fill="white" stroke="#bbf7d0" stroke-width="1"/>
