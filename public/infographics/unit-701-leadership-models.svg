<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif"><rect x="0.8" y="0.8" width="758.5" height="488.5" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/><text x="28" y="41" font-size="19" fill="#1a2e4a" font-weight="700">CMI 701: Strategic Leadership Models Compared</text><text x="28" y="64.3" font-size="12.5" fill="#6b7280">Critically Analyse each model: evidence, limits and where it applies</text><clipPath id="tc36"><rect x="28" y="84.6" width="704" height="362.4" rx="10"/></clipPath><g clip-path="url(#tc36)"><rect x="28" y="84.6" width="704" height="362.4" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="28" y="84.6" width="107.6" height="43" rx="0" fill="#1a2e4a" stroke="none" stroke-width="1"/><text x="35" y="101.6" font-size="11" fill="#fff" font-weight="700">Model</text><rect x="135.6" y="84.6" width="156.4" height="43" rx="0" fill="#1e3a5f" stroke="none" stroke-width="1"/><text x="142.6" y="101.6" font-size="11" fill="#fff" font-weight="700">Core proposition</text><rect x="292" y="84.6" width="156.4" height="43" rx="0" fill="#2563eb" stroke="none" stroke-width="1"/><text x="299" y="101.6" font-size="11" fill="#fff" font-weight="700">Empirical evidence</text><text x="299" y="116.1" font-size="11" fill="#fff" font-weight="700">base</text><rect x="448.4" y="84.6" width="156.4" height="43" rx="0" fill="#b45309" stroke="none" stroke-width="1"/><text x="455.4" y="101.6" font-size="11" fill="#fff" font-weight="700">Key theoretical</text><text x="455.4" y="116.1" font-size="11" fill="#fff" font-weight="700">limitation</text><rect x="604.9" y="84.6" width="127.1" height="43" rx="0" fill="#15803d" stroke="none" stroke-width="1"/><text x="611.9" y="101.6" font-size="11" fill="#fff" font-weight="700">Strategic</text><text x="611.9" y="116.1" font-size="11" fill="#fff" font-weight="700">application</text><text x="35" y="144.2" font-size="10.5" fill="#1a2e4a" font-weight="700">Transformational</text><text x="35" y="158" font-size="10.5" fill="#1a2e4a" font-weight="700">(Bass and</text><text x="35" y="171.9" font-size="10.5" fill="#1a2e4a" font-weight="700">Avolio)</text><text x="142.6" y="144.2" font-size="10.5" fill="#1f2937">Leaders inspire through</text><text x="142.6" y="158" font-size="10.5" fill="#1f2937">idealised influence,</text><text x="142.6" y="171.9" font-size="10.5" fill="#1f2937">inspiration,</text><text x="142.6" y="185.7" font-size="10.5" fill="#1f2937">intellectual stimulation</text><text x="142.6" y="199.6" font-size="10.5" fill="#1f2937">and individual</text><text x="142.6" y="213.5" font-size="10.5" fill="#1f2937">consideration</text><text x="299" y="144.2" font-size="10.5" fill="#1f2937">Extensive meta-analytic</text><text x="299" y="158" font-size="10.5" fill="#1f2937">support for follower</text><text x="299" y="171.9" font-size="10.5" fill="#1f2937">performance,</text><text x="299" y="185.7" font-size="10.5" fill="#1f2937">satisfaction and</text><text x="299" y="199.6" font-size="10.5" fill="#1f2937">commitment, with</text><text x="299" y="213.5" font-size="10.5" fill="#1f2937">moderate effect sizes</text><text x="455.4" y="144.2" font-size="10.5" fill="#1f2937">Heroic-leader bias,</text><text x="455.4" y="158" font-size="10.5" fill="#1f2937">cultural dependency,</text><text x="455.4" y="171.9" font-size="10.5" fill="#1f2937">risk of follower</text><text x="455.4" y="185.7" font-size="10.5" fill="#1f2937">dependency</text><text x="611.9" y="144.2" font-size="10.5" fill="#1f2937">Organisational</text><text x="611.9" y="158" font-size="10.5" fill="#1f2937">change and</text><text x="611.9" y="171.9" font-size="10.5" fill="#1f2937">transformation</text><line x1="28" y1="127.7" x2="732" y2="127.7" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="224.8" width="704" height="69.4" rx="0" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="35" y="241.3" font-size="10.5" fill="#1a2e4a" font-weight="700">Distributed</text><text x="35" y="255.2" font-size="10.5" fill="#1a2e4a" font-weight="700">(Spillane,</text><text x="35" y="269" font-size="10.5" fill="#1a2e4a" font-weight="700">Gronn)</text><text x="142.6" y="241.3" font-size="10.5" fill="#1f2937">Leadership is a</text><text x="142.6" y="255.2" font-size="10.5" fill="#1f2937">collective practice</text><text x="142.6" y="269" font-size="10.5" fill="#1f2937">spread across roles, not</text><text x="142.6" y="282.9" font-size="10.5" fill="#1f2937">one leader</text><text x="299" y="241.3" font-size="10.5" fill="#1f2937">Healthcare research</text><text x="299" y="255.2" font-size="10.5" fill="#1f2937">links it to innovation</text><text x="299" y="269" font-size="10.5" fill="#1f2937">and performance, but</text><text x="299" y="282.9" font-size="10.5" fill="#1f2937">mostly qualitative</text><text x="455.4" y="241.3" font-size="10.5" fill="#1f2937">In tension with</text><text x="455.4" y="255.2" font-size="10.5" fill="#1f2937">leader-vision models.</text><text x="455.4" y="269" font-size="10.5" fill="#1f2937">Needs deliberate</text><text x="455.4" y="282.9" font-size="10.5" fill="#1f2937">organisational design</text><text x="611.9" y="241.3" font-size="10.5" fill="#1f2937">Complex,</text><text x="611.9" y="255.2" font-size="10.5" fill="#1f2937">multi-stakeholder</text><text x="611.9" y="269" font-size="10.5" fill="#1f2937">organisations</text><line x1="28" y1="224.8" x2="732" y2="224.8" stroke="#e5e7eb" stroke-width="1"/><text x="35" y="310.8" font-size="10.5" fill="#1a2e4a" font-weight="700">Authentic</text><text x="35" y="324.6" font-size="10.5" fill="#1a2e4a" font-weight="700">(Avolio,</text><text x="35" y="338.5" font-size="10.5" fill="#1a2e4a" font-weight="700">Gardner)</text><text x="142.6" y="310.8" font-size="10.5" fill="#1f2937">Self-awareness,</text><text x="142.6" y="324.6" font-size="10.5" fill="#1f2937">relational transparency,</text><text x="142.6" y="338.5" font-size="10.5" fill="#1f2937">balanced processing,</text><text x="142.6" y="352.3" font-size="10.5" fill="#1f2937">internalised moral</text><text x="142.6" y="366.2" font-size="10.5" fill="#1f2937">perspective</text><text x="299" y="310.8" font-size="10.5" fill="#1f2937">Linked to trust,</text><text x="299" y="324.6" font-size="10.5" fill="#1f2937">wellbeing and</text><text x="299" y="338.5" font-size="10.5" fill="#1f2937">engagement. Performance</text><text x="299" y="352.3" font-size="10.5" fill="#1f2937">link less well</text><text x="299" y="366.2" font-size="10.5" fill="#1f2937">established</text><text x="455.4" y="310.8" font-size="10.5" fill="#1f2937">Social-construction</text><text x="455.4" y="324.6" font-size="10.5" fill="#1f2937">critique of a stable</text><text x="455.4" y="338.5" font-size="10.5" fill="#1f2937">&quot;true self&quot;</text><text x="611.9" y="310.8" font-size="10.5" fill="#1f2937">Building trust and</text><text x="611.9" y="324.6" font-size="10.5" fill="#1f2937">an ethical climate</text><line x1="28" y1="294.3" x2="732" y2="294.3" stroke="#e5e7eb" stroke-width="1"/><rect x="28" y="377.6" width="704" height="69.4" rx="0" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="35" y="394.1" font-size="10.5" fill="#1a2e4a" font-weight="700">Adaptive</text><text x="35" y="407.9" font-size="10.5" fill="#1a2e4a" font-weight="700">(Heifetz,</text><text x="35" y="421.8" font-size="10.5" fill="#1a2e4a" font-weight="700">Laurie)</text><text x="142.6" y="394.1" font-size="10.5" fill="#1f2937">Separates technical</text><text x="142.6" y="407.9" font-size="10.5" fill="#1f2937">problems from adaptive</text><text x="142.6" y="421.8" font-size="10.5" fill="#1f2937">challenges that require</text><text x="142.6" y="435.6" font-size="10.5" fill="#1f2937">people to change</text><text x="299" y="394.1" font-size="10.5" fill="#1f2937">Limited evidence that it</text><text x="299" y="407.9" font-size="10.5" fill="#1f2937">produces better</text><text x="299" y="421.8" font-size="10.5" fill="#1f2937">outcomes. Largely</text><text x="299" y="435.6" font-size="10.5" fill="#1f2937">normative</text><text x="455.4" y="394.1" font-size="10.5" fill="#1f2937">Diagnosing the type of</text><text x="455.4" y="407.9" font-size="10.5" fill="#1f2937">problem is demanding</text><text x="611.9" y="394.1" font-size="10.5" fill="#1f2937">Digital</text><text x="611.9" y="407.9" font-size="10.5" fill="#1f2937">transformation,</text><text x="611.9" y="421.8" font-size="10.5" fill="#1f2937">recovery, public</text><text x="611.9" y="435.6" font-size="10.5" fill="#1f2937">service change</text><line x1="28" y1="377.6" x2="732" y2="377.6" stroke="#e5e7eb" stroke-width="1"/><line x1="135.6" y1="127.7" x2="135.6" y2="447" stroke="#e5e7eb" stroke-width="1"/><line x1="292" y1="127.7" x2="292" y2="447" stroke="#e5e7eb" stroke-width="1"/><line x1="448.4" y1="127.7" x2="448.4" y2="447" stroke="#e5e7eb" stroke-width="1"/><line x1="604.9" y1="127.7" x2="604.9" y2="447" stroke="#e5e7eb" stroke-width="1"/></g><rect x="28" y="84.6" width="704" height="362.4" rx="10" fill="none" stroke="#e5e7eb" stroke-width="1.5"/><text x="732" y="471.5" font-size="10.5" fill="#6b7280" text-anchor="end">cmiassignmentsupport.co.uk · CMI Unit 701 assignment help</text></svg>
