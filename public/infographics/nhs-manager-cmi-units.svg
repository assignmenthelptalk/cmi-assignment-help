<rect x="504" y="360" width="438" height="44" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
<text x="723" y="377" text-anchor="middle" font-size="10" fill="#4338ca" font-weight="600">Also relevant at Level 7:</text>
<text x="723" y="393" text-anchor="middle" font-size="10" fill="#6b7280">CMI 706 (Finance for Strategic Leaders) — NHS multi-million pound budget accountability</text>

<!-- divider gap label -->
<text x="480" y="246" text-anchor="middle" font-size="9" fill="#9ca3af" transform="rotate(-90, 480, 246)">vs</text>

