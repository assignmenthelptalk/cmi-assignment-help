<text x="300" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2e4a">Principles of Management and Leadership</text>
<text x="300" y="137" text-anchor="middle" font-size="10" fill="#6b7280">Core L5 unit — leadership theory applied to ward and service management context</text>

